<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AWS First Cloud AI Journey (FCAJ) Internship & Workshop Report Website" />
    <meta name="theme-color" content="#0F1B2D" />
    <title>AWS FCAJ Internship Report</title>
    <!-- Prevent dark/light mode flashing before React mounts -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('fcaj_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}

        // Single Page Apps for GitHub Pages
        (function(l) {
          if (l.search[1] === '/' ) {
            var decoded = l.search.slice(1).split('&').map(function(s) { 
              return s.replace(/~and~/g, '&')
            }).join('?');
            window.history.replaceState(null, null,
                l.pathname.slice(0, -1) + decoded + l.hash
            );
          }
        }(window.location));
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 dark:bg-aws-deep dark:text-slate-100 min-h-screen antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
